[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvtally"
version = "0.1.0"
description = "Count occurrences of distinct values in a CSV column"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "roche-works92" }]

[project.scripts]
csvtally = "csvtally.cli:main"

[tool.setuptools.packages.find]
include = ["csvtally*"]
